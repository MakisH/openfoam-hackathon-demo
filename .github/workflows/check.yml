name: Check
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Install shellcheck
      run: |
        apt update && apt install -y shellcheck
    - name: Check my-script.sh
      run: |
        shellcheck my-script.sh